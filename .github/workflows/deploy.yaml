name: Deploy to EC2

on:
  push:
    branches: [main, dev]
    paths:
      - 'server/**'
  workflow_dispatch: # manual trigger

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Build TypeScript
        working-directory: server
        run: npm run build

      - name: Generate .env.production from Base64
        working-directory: server
        env:
          ENV_PRODUCTION_BASE64: ${{ secrets.ENV_PRODUCTION_BASE64 }}
        run: |
          if [ -n "$ENV_PRODUCTION_BASE64" ]; then
            echo "Decoding .env.production from Base64 secret..."
            echo "$ENV_PRODUCTION_BASE64" | base64 --decode > .env.production
            cp .env.production .env
            echo "✅ .env.production generated successfully from Base64"
          elif [ -f .env.production ]; then
            echo "ℹ️ .env.production already present in workspace."
            cp .env.production .env
          else
            echo "⚠️ No ENV_PRODUCTION_BASE64 secret provided; relying on server environment."
          fi

      - name: Create deployment package
        working-directory: server
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp -r src deploy/
          cp package*.json deploy/
          [ -f ecosystem.config.cjs ] && cp ecosystem.config.cjs deploy/ || true
          [ -f .env.production ] && cp .env.production deploy/.env.production || true
          [ -f .env ] && cp .env deploy/.env || true
          [ -f .env.example ] && cp .env.example deploy/ || true
          tar -czf ../deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf "%s\n" "$SSH_PRIVATE_KEY" > prevue.pem
          chmod 600 prevue.pem

          scp -i prevue.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 \
            deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          ssh -i prevue.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 \
            ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            
            # Load NVM and Node PATH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:/bin"

            # Set Application Directory
            APP_DIR="/var/www/prevue-app"
            sudo mkdir -p "$APP_DIR"
            sudo chown -R $USER:$USER "$APP_DIR"
            cd "$APP_DIR"

            # Backup existing deployment
            if [ -d "dist" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz dist package.json ecosystem.config.cjs .env .env.production 2>/dev/null || true
              ls -t backups/backup_*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm
            fi

            # Extract new deployment
            echo "Extracting new package..."
            tar --overwrite -xzf /tmp/deploy.tar.gz -C "$APP_DIR"
            rm -f /tmp/deploy.tar.gz

            # Fix ownership after extraction
            sudo chown -R $USER:$USER "$APP_DIR"

            # Install production dependencies
            echo "Installing dependencies..."
            npm install --omit=dev

            mkdir -p logs

            # Start or Reload PM2
            if command -v pm2 >/dev/null 2>&1; then
              NODE_ENV=production pm2 startOrReload ecosystem.config.cjs --env production --update-env || NODE_ENV=production pm2 start ecosystem.config.cjs --env production
              pm2 save
            else
              echo "Installing PM2 globally..."
              npm install -g pm2 2>/dev/null || true
              NODE_ENV=production pm2 startOrReload ecosystem.config.cjs --env production --update-env || NODE_ENV=production pm2 start ecosystem.config.cjs --env production
              pm2 save
            fi
          EOF

          rm -f prevue.pem